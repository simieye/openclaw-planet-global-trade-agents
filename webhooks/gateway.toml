# ============================================================
# 龙虾星球共创联盟 - Webhook Gateway
# 统一外部系统事件接入网关
# 50个业务自动化Webhook工作流
# ============================================================

[meta]
version = "3.0"
engine = "openclaw"
cluster = "lobster-planet-alliance"

[gateway]
enabled = true
port = 8080
secret_token = "${WEBHOOK_SECRET}"
rate_limit_per_minute = 600

# ============================================================
# 一、CRM系统Webhook（01-08）
# ============================================================

[[gateway.routes]]
id = "wh_crm_new_lead"
name = "新线索自动评分"
description = "CRM新增客户 → Lead Agent → SDR Agent"
event = "new_lead"
source = "crm"
method = "POST"
path = "/hooks/crm/new-lead"
agent = "lead_agent"
action = "enrich_and_score_lead"
taskflow = "customer_acquisition"
payload = { lead_id = "$.lead_id", source = "$.source", contact = "$.contact" }

[[gateway.routes]]
id = "wh_crm_lead_enrichment"
name = "客户画像补全"
description = "新客户录入 → LinkedIn Agent → Company Research"
event = "lead_created"
source = "crm"
method = "POST"
path = "/hooks/crm/lead-created"
agent = "lead_agent"
action = "enrich_lead_profile"
payload = { lead_id = "$.id", company = "$.company", email = "$.email" }

[[gateway.routes]]
id = "wh_crm_deal_stage"
name = "商机阶段变更"
description = "商机阶段变更 → Pipeline Agent → Sales Agent"
event = "deal_stage_changed"
source = "crm"
method = "POST"
path = "/hooks/crm/deal-stage"
agent = "crm_agent"
action = "handle_stage_change"
payload = { deal_id = "$.deal_id", from_stage = "$.from", to_stage = "$.to" }

[[gateway.routes]]
id = "wh_crm_deal_lost"
name = "丢单分析"
description = "商机关闭 → Loss Analysis Agent"
event = "deal_lost"
source = "crm"
method = "POST"
path = "/hooks/crm/deal-lost"
agent = "crm_agent"
action = "analyze_loss_reason"
payload = { deal_id = "$.deal_id", close_reason = "$.reason" }

