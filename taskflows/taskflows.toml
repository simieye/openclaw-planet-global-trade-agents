[[taskflow.alliance_growth.steps]]
order = 5
agent = "training_agent"
action = "train_alliance_members"
input_from = "partner_agent"
output_to = "community_agent"
timeout_seconds = 3600

[[taskflow.alliance_growth.steps]]
order = 6
agent = "community_agent"
action = "engage_community"
input_from = "training_agent"
output_to = "ecosystem_agent"
timeout_seconds = 1200

[[taskflow.alliance_growth.steps]]
order = 7
agent = "ecosystem_agent"
action = "report_alliance_growth"
input_from = "community_agent"
output_to = "ceo_agent"
timeout_seconds = 600

# ============================================================
# 错误处理和重试策略
# ============================================================
[taskflow.error_handling]
retry_strategy = "exponential_backoff"
max_retries = 3
retry_delay_seconds = [60, 300, 900]
fallback_action = "notify_ceo_agent"

[taskflow.notifications]
on_success = ["ceo_agent", "anygen_workspace"]
on_failure = ["ceo_agent", "slack", "email"]
on_step_complete = ["anygen_workspace"]
