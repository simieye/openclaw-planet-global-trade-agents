# ============================================================
# 错误处理和重试策略
# ============================================================
[taskflow.error_handling]
retry_strategy = "exponential_backoff"
max_retries = 3
retry_delay_seconds = [60, 300, 900]
fallback_action = "notify_ceo_agent"

[taskflow.notifications]
on_success = ["ceo_agent", "anygen_workspace"]
on_failure = ["ceo_agent", "slack", "email"]
on_step_complete = ["anygen_workspace"]
