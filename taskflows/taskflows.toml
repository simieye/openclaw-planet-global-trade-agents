# ============================================================
# 龙虾星球共创联盟 - TaskFlow 执行引擎
# OpenClaw TaskFlow 完整工作流定义
# ============================================================

[meta]
version = "3.0"
engine = "openclaw"
cluster = "lobster-planet-alliance"

# ============================================================
# 一、核心业务TaskFlow
# ============================================================

# 客户成交 TaskFlow
[taskflow.customer_acquisition]
name = "客户成交流水线"
description = "从线索到成交的全流程自动化"
priority = "high"
trigger = "lead_scored_above_threshold"

[[taskflow.customer_acquisition.steps]]
order = 1
agent = "lead_agent"
action = "enrich_and_score_lead"
input_from = "webhook:new_lead_detected"
output_to = "sdr_agent"
timeout_seconds = 300

[[taskflow.customer_acquisition.steps]]
order = 2
agent = "sdr_agent"
action = "create_outreach_sequence"
input_from = "lead_agent"
output_to = "sales_agent"
timeout_seconds = 600
condition = "lead_score >= 70"

[[taskflow.customer_acquisition.steps]]
order = 3
agent = "sales_agent"
action = "engage_and_qualify"
input_from = "sdr_agent"
output_to = "proposal_agent"
timeout_seconds = 3600
condition = "lead_responded == true"

[[taskflow.customer_acquisition.steps]]
order = 4
agent = "proposal_agent"
action = "generate_proposal"
input_from = "sales_agent"
output_to = "quotation_agent"
timeout_seconds = 600

[[taskflow.customer_acquisition.steps]]
order = 5
agent = "quotation_agent"
action = "generate_quotation"
input_from = "proposal_agent"
output_to = "contract_agent"
timeout_seconds = 300
condition = "proposal_accepted == true"

[[taskflow.customer_acquisition.steps]]
order = 6
agent = "contract_agent"
action = "generate_contract"
input_from = "quotation_agent"
output_to = "payment_agent"
timeout_seconds = 600
condition = "quotation_accepted == true"

[[taskflow.customer_acquisition.steps]]
order = 7
agent = "payment_agent"
action = "process_payment"
input_from = "contract_agent"
output_to = "order_agent"
timeout_seconds = 1800
condition = "contract_signed == true"

[[taskflow.customer_acquisition.steps]]
order = 8
agent = "customer_success_agent"
action = "start_onboarding"
input_from = "payment_agent"
output_to = "crm"
timeout_seconds = 300
condition = "payment_confirmed == true"

# ============================================================
# 电商运营 TaskFlow
# ============================================================
[taskflow.ecommerce_operations]
name = "电商运营流水线"
description = "趋势驱动的内容-广告-留存全链路"
priority = "high"
trigger = "scheduled:daily"

[[taskflow.ecommerce_operations.steps]]
order = 1
agent = "trend_agent"
action = "scan_trends"
input_from = "scheduled:daily_trend_scan"
output_to = "content_agent"
timeout_seconds = 600

[[taskflow.ecommerce_operations.steps]]
order = 2
agent = "content_agent"
action = "generate_content_batch"
input_from = "trend_agent"
output_to = "video_agent"
timeout_seconds = 1800

[[taskflow.ecommerce_operations.steps]]
order = 3
agent = "video_agent"
action = "produce_videos"
input_from = "content_agent"
output_to = "ads_agent"
timeout_seconds = 3600

[[taskflow.ecommerce_operations.steps]]
order = 4
agent = "ads_agent"
action = "launch_and_optimize_ads"
input_from = "video_agent"
output_to = "crm_agent"
timeout_seconds = 600

[[taskflow.ecommerce_operations.steps]]
order = 5
agent = "crm_agent"
action = "sync_and_analyze_customers"
input_from = "ads_agent"
output_to = "retention_agent"
timeout_seconds = 300

[[taskflow.ecommerce_operations.steps]]
order = 6
agent = "retention_agent"
action = "run_retention_campaign"
input_from = "crm_agent"
output_to = "ceo_agent"
timeout_seconds = 600

# ============================================================
# 工厂生产 TaskFlow
# ============================================================
[taskflow.factory_production]
name = "工厂生产流水线"
description = "订单到发货的全流程自动化"
priority = "critical"
trigger = "order_confirmed"

[[taskflow.factory_production.steps]]
order = 1
agent = "order_agent"
action = "process_order"
input_from = "webhook:order_confirmed"
output_to = "production_agent"
timeout_seconds = 300

[[taskflow.factory_production.steps]]
order = 2
agent = "production_agent"
action = "schedule_production"
input_from = "order_agent"
output_to = "procurement_agent"
timeout_seconds = 600
condition = "inventory_insufficient == true"

[[taskflow.factory_production.steps]]
order = 3
agent = "procurement_agent"
action = "procure_materials"
input_from = "production_agent"
output_to = "production_agent"
timeout_seconds = 1800

[[taskflow.factory_production.steps]]
order = 4
agent = "quality_agent"
action = "inspect_batch"
input_from = "production_agent"
output_to = "logistics_agent"
timeout_seconds = 600
condition = "production_completed == true"

[[taskflow.factory_production.steps]]
order = 5
agent = "logistics_agent"
action = "ship_order"
input_from = "quality_agent"
output_to = "order_agent"
timeout_seconds = 600
condition = "quality_passed == true"

[[taskflow.factory_production.steps]]
order = 6
agent = "order_agent"
action = "update_order_status"
input_from = "logistics_agent"
output_to = "customer_success_agent"
timeout_seconds = 300

