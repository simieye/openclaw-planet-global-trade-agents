<!DOCTYPE html>
<html lang="zh-CN" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦞 龙虾星球共创联盟 - 登录</title>
<style>
:root {
  --bg: #080812; --card-bg: #12122a; --border: #1e1e3a;
  --accent: #ff6b35; --accent2: #00d4aa; --text: #e0e0e0;
  --text-dim: #6b7280; --text-bright: #f0f0f0;
  --success: #22c55e; --danger: #ef4444;
}
[data-theme="light"] {
  --bg: #f8f9fa; --card-bg: #ffffff; --border: #e5e7eb;
  --accent: #d97706; --accent2: #059669; --text: #1f2937;
  --text-dim: #6b7280; --text-bright: #111827;
}
[data-theme="dark"] {
  --bg: #000000; --card-bg: #111111; --border: #222222;
  --accent: #f97316; --accent2: #10b981; --text: #fafafa;
  --text-dim: #737373; --text-bright: #ffffff;
}
[data-theme="minimal"] {
  --bg: #fafaf8; --card-bg: #ffffff; --border: #eeece8;
  --accent: #c2853a; --accent2: #7da356; --text: #2c2416;
  --text-dim: #9b9080; --text-bright: #1a1510;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* 背景装饰 */
.bg-decoration {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.bg-circle {
  position: absolute;
  border-radius: 50%;
  opacity: 0.06;
  filter: blur(80px);
}
.bg-circle:nth-child(1) { width: 600px; height: 600px; background: var(--accent); top: -200px; right: -100px; }
.bg-circle:nth-child(2) { width: 400px; height: 400px; background: var(--accent2); bottom: -150px; left: -100px; }
.bg-circle:nth-child(3) { width: 300px; height: 300px; background: #6366f1; top: 50%; left: 50%; transform: translate(-50%, -50%); }

/* 主容器 */
.auth-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 900px;
  display: flex;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

/* 左侧品牌区 */
.brand-panel {
  flex: 1;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  padding: 50px 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #fff;
  position: relative;
  overflow: hidden;
}
.brand-panel::before {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: rgba(255,107,53,0.1);
  top: -50px; right: -50px;
}
.brand-panel::after {
  content: '';
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: rgba(0,212,170,0.1);
  bottom: -30px; left: -30px;
}
.brand-logo {
  font-size: 56px;
  margin-bottom: 16px;
  position: relative;
  z-index: 1;
}
.brand-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
  position: relative;
  z-index: 1;
}
.brand-subtitle {
  font-size: 14px;
  opacity: 0.7;
  line-height: 1.6;
  position: relative;
  z-index: 1;
}
.brand-features {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 30px;
  position: relative;
  z-index: 1;
}
.brand-tag {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  color: rgba(255,255,255,0.8);
}

/* 右侧表单区 */
.form-panel {
  flex: 1;
  padding: 50px 40px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.form-header {
  margin-bottom: 30px;
}
.form-header h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
}
.form-header p {
  font-size: 13px;
  color: var(--text-dim);
}

/* 模式切换标签 */
.mode-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  background: var(--bg);
  border-radius: 10px;
  padding: 3px;
}
.mode-tab {
  flex: 1;
  padding: 8px 12px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: all 0.2s;
  white-space: nowrap;
}
.mode-tab.active {
  background: var(--accent);
  color: #fff;
}

/* 表单 */
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-dim);
}
.form-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus {
  border-color: var(--accent);
}
.form-input::placeholder {
  color: var(--text-dim);
  opacity: 0.6;
}
.form-row {
  display: flex;
  gap: 12px;
}
.form-row .form-group {
  flex: 1;
}

/* 按钮 */
.btn-submit {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.btn-submit:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}
.btn-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* 分割线 */
.divider {
  display: flex;
  align-items: center;
  margin: 20px 0;
  color: var(--text-dim);
  font-size: 12px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.divider span { padding: 0 12px; }

/* 演示账号 */
.demo-accounts {
  background: var(--bg);
  border-radius: 10px;
  padding: 12px 16px;
  margin-top: 16px;
}
.demo-accounts .demo-title {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.demo-accounts .demo-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  padding: 4px 0;
}
.demo-accounts .demo-role {
  color: var(--accent);
  font-weight: 500;
}
.demo-accounts .demo-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
}
.demo-accounts .demo-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* 错误消息 */
.error-msg {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  color: var(--danger);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 16px;
  display: none;
}
.error-msg.show { display: block; }

/* 成功消息 */
.success-msg {
  background: rgba(34,197,94,0.1);
  border: 1px solid rgba(34,197,94,0.3);
  color: var(--success);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 16px;
  display: none;
}
.success-msg.show { display: block; }

/* 加载动画 */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-right: 6px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 响应式 */
@media (max-width: 768px) {
  .auth-container { flex-direction: column; }
  .brand-panel { padding: 30px 24px; }
  .form-panel { padding: 30px 24px; }
  .brand-features { display: none; }
  .brand-logo { font-size: 40px; }
  .brand-title { font-size: 20px; }
}
</style>
</head>
<body>

<div class="bg-decoration">
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
</div>

<div class="auth-container">
  <!-- 左侧品牌面板 -->
  <div class="brand-panel">
    <div class="brand-logo">🦞</div>
    <div class="brand-title">龙虾星球共创联盟</div>
    <div class="brand-subtitle">
      AI 驱动的跨境电商品牌出海<br>
      智能体集群工作台
    </div>
    <div class="brand-features">
      <span class="brand-tag">100+ AI 拍档</span>
      <span class="brand-tag">40+ TaskFlow</span>
      <span class="brand-tag">50+ Webhook</span>
      <span class="brand-tag">企业版</span>
      <span class="brand-tag">多平台</span>
    </div>
  </div>

  <!-- 右侧表单面板 -->
  <div class="form-panel">
    <div class="form-header">
      <h2 id="formTitle">欢迎回来</h2>
      <p id="formDesc">登录您的账号，开始 AI 驱动的品牌增长之旅</p>
    </div>

    <!-- 模式切换 -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="login" onclick="switchMode('login')">🔑 登录</button>
      <button class="mode-tab" data-mode="register" onclick="switchMode('register')">📝 注册</button>
      <button class="mode-tab" data-mode="enterprise" onclick="switchMode('enterprise')">🏢 企业注册</button>
    </div>

    <!-- 错误/成功消息 -->
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <!-- 登录表单 -->
    <form id="loginForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" class="form-input" id="email" placeholder="请输入邮箱地址" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" class="form-input" id="password" placeholder="请输入密码" required>
      </div>

      <!-- 注册额外字段 -->
      <div id="registerFields" style="display:none;">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" class="form-input" id="username" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>显示名称</label>
          <input type="text" class="form-input" id="displayName" placeholder="可选">
        </div>
      </div>

      <!-- 企业注册额外字段 -->
      <div id="enterpriseFields" style="display:none;">
        <div class="form-group">
          <label>企业名称 *</label>
          <input type="text" class="form-input" id="companyName" placeholder="请输入企业名称">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>行业</label>
            <select class="form-input" id="industry">
              <option value="">请选择</option>
              <option value="跨境电商">跨境电商</option>
              <option value="外贸工厂">外贸工厂</option>
              <option value="品牌零售">品牌零售</option>
              <option value="SaaS服务">SaaS 服务</option>
              <option value="物流供应链">物流供应链</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label>规模</label>
            <select class="form-input" id="companySize">
              <option value="">请选择</option>
              <option value="small">小型 (1-50人)</option>
              <option value="medium">中型 (50-200人)</option>
              <option value="large">大型 (200-1000人)</option>
              <option value="enterprise">超大型 (1000+人)</option>
            </select>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">登 录</span>
      </button>
    </form>

    <!-- 演示账号 -->
    <div class="demo-accounts" id="demoAccounts">
      <div class="demo-title">🔑 演示账号（一键登录）</div>
      <div class="demo-row">
        <span class="demo-role">👤 个人用户</span>
        <button class="demo-btn" onclick="demoLogin('admin@lobster.planet','admin123')">一键登录</button>
      </div>
      <div class="demo-row">
        <span style="color:var(--text-dim);font-size:11px;">admin@lobster.planet</span>
        <span style="color:var(--text-dim);font-size:11px;">admin123</span>
      </div>
    </div>

    <!-- 注册提示 -->
    <div style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-dim);" id="switchHint">
      还没有账号？<a href="#" onclick="switchMode('register')" style="color:var(--accent);">立即注册</a>
    </div>
  </div>
</div>

<script>
// ============================================================
// 配置
// ============================================================
const API_BASE = window.location.origin.replace(':9080', ':8080').replace('/dashboard','');
let currentMode = 'login';
let isSubmitting = false;

// ============================================================
// 模式切换
// ============================================================
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.mode-tab[data-mode="${mode}"]`).classList.add('active');
  
  const titles = { login: '欢迎回来', register: '创建账号', enterprise: '注册企业' };
  const descs = { 
    login: '登录您的账号，开始 AI 驱动的品牌增长之旅',
    register: '注册个人账号，体验 AI 智能体工作台',
    enterprise: '注册企业账号，解锁团队协作和高级功能'
  };
  
  document.getElementById('formTitle').textContent = titles[mode];
  document.getElementById('formDesc').textContent = descs[mode];
  document.getElementById('btnText').textContent = mode === 'login' ? '登 录' : '注 册';
  
  document.getElementById('registerFields').style.display = (mode === 'register' || mode === 'enterprise') ? 'block' : 'none';
  document.getElementById('enterpriseFields').style.display = mode === 'enterprise' ? 'block' : 'none';
  document.getElementById('demoAccounts').style.display = mode === 'login' ? 'block' : 'none';
  
  const hint = document.getElementById('switchHint');
  if (mode === 'login') {
    hint.innerHTML = '还没有账号？<a href="#" onclick="switchMode(\'register\')" style="color:var(--accent);">立即注册</a> 或 <a href="#" onclick="switchMode(\'enterprise\')" style="color:var(--accent2);">注册企业</a>';
  } else if (mode === 'register') {
    hint.innerHTML = '已有账号？<a href="#" onclick="switchMode(\'login\')" style="color:var(--accent);">返回登录</a>';
  } else {
    hint.innerHTML = '已有企业账号？<a href="#" onclick="switchMode(\'login\')" style="color:var(--accent);">返回登录</a>';
  }
  
  hideMessages();
  
  // 注册模式设置必填
  document.getElementById('username').required = (mode === 'register' || mode === 'enterprise');
  document.getElementById('companyName').required = (mode === 'enterprise');
}

// ============================================================
// 消息显示
// ============================================================
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('successMsg').classList.remove('show');
}
function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('errorMsg').classList.remove('show');
}
function hideMessages() {
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('successMsg').classList.remove('show');
}

// ============================================================
// 表单提交
// ============================================================
async function handleSubmit(e) {
  e.preventDefault();
  if (isSubmitting) return;
  
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  
  if (!email || !password) {
    showError('请填写邮箱和密码');
    return;
  }
  
  isSubmitting = true;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>处理中...';
  hideMessages();
  
  try {
    let endpoint, body;
    
    if (currentMode === 'login') {
      endpoint = `${API_BASE}/api/auth/login`;
      body = { email, password };
    } else if (currentMode === 'register') {
      const username = document.getElementById('username').value.trim();
      const displayName = document.getElementById('displayName').value.trim();
      if (!username) { showError('请输入用户名'); return; }
      endpoint = `${API_BASE}/api/auth/register`;
      body = { username, email, password, display_name: displayName || username, plan: 'free' };
    } else {
      const username = document.getElementById('username').value.trim();
      const companyName = document.getElementById('companyName').value.trim();
      if (!username) { showError('请输入用户名'); return; }
      if (!companyName) { showError('请输入企业名称'); return; }
      endpoint = `${API_BASE}/api/auth/register/enterprise`;
      body = {
        company_name: companyName,
        admin_username: username,
        admin_email: email,
        password,
        industry: document.getElementById('industry').value,
        size: document.getElementById('companySize').value,
      };
    }
    
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    
    const data = await resp.json();
    
    if (!resp.ok) {
      const errMsg = data.detail || data.error || '请求失败';
      showError(typeof errMsg === 'object' ? JSON.stringify(errMsg) : errMsg);
      return;
    }
    
    if (currentMode === 'login') {
      // 登录成功，保存 token
      const tokenData = {
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        user: data.user,
        expires_at: Date.now() + (data.expires_in || 259200) * 1000,
      };
      localStorage.setItem('lobster-auth', JSON.stringify(tokenData));
      
      // 如果是企业用户，保存企业信息
      if (data.user.enterprise_id) {
        try {
          const entResp = await fetch(`${API_BASE}/api/auth/enterprise`, {
            headers: { 'Authorization': `Bearer ${data.access_token}` }
          });
          if (entResp.ok) {
            const entData = await entResp.json();
            if (entData.success) {
              localStorage.setItem('lobster-enterprise', JSON.stringify(entData.enterprise));
            }
          }
        } catch(e) {}
      }
      
      showSuccess('登录成功！正在跳转...');
      setTimeout(() => {
        // 跳转到 Dashboard 或企业版
        if (data.user.role === 'enterprise_admin' || data.user.role === 'enterprise_user') {
          window.location.href = '/enterprise-os';
        } else {
          window.location.href = '/';
        }
      }, 800);
    } else {
      // 注册成功
      showSuccess('注册成功！正在跳转到登录...');
      setTimeout(() => {
        switchMode('login');
        document.getElementById('email').value = email;
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }, 1000);
    }
    
  } catch(err) {
    showError(`网络错误：${err.message}`);
  } finally {
    isSubmitting = false;
    btn.disabled = false;
    btn.innerHTML = `<span id="btnText">${currentMode === 'login' ? '登 录' : '注 册'}</span>`;
  }
}

// ============================================================
// 演示登录
// ============================================================
function demoLogin(email, password) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = password;
  document.querySelector('form').requestSubmit();
}

// ============================================================
// 检查登录状态
// ============================================================
function checkAuth() {
  try {
    const authStr = localStorage.getItem('lobster-auth');
    if (!authStr) return null;
    
    const auth = JSON.parse(authStr);
    if (Date.now() > auth.expires_at) {
      // Token 过期，尝试刷新
      return refreshAuth(auth);
    }
    return auth;
  } catch(e) {
    return null;
  }
}

async function refreshAuth(oldAuth) {
  try {
    const resp = await fetch(`${API_BASE}/api/auth/refresh`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: oldAuth.refresh_token }),
    });
    if (!resp.ok) return null;
    const data = await resp.json();
    const newAuth = {
      ...oldAuth,
      access_token: data.access_token,
      expires_at: Date.now() + data.expires_in * 1000,
    };
    localStorage.setItem('lobster-auth', JSON.stringify(newAuth));
    return newAuth;
  } catch(e) {
    return null;
  }
}

function getAuthHeader() {
  const auth = checkAuth();
  if (auth) {
    return { 'Authorization': `Bearer ${auth.access_token}`, 'Content-Type': 'application/json' };
  }
  return { 'Content-Type': 'application/json' };
}

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  // 检查是否已登录
  const auth = checkAuth();
  if (auth) {
    // 已登录，直接跳转
    const user = auth.user;
    if (user && (user.role === 'enterprise_admin' || user.role === 'enterprise_user')) {
      window.location.href = '/enterprise-os';
    } else {
      window.location.href = '/';
    }
    return;
  }
  
  // 从 URL 参数获取模式
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode');
  if (mode && ['login','register','enterprise'].includes(mode)) {
    switchMode(mode);
  }
});
</script>

</body>
</html>
