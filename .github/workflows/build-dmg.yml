name: Build macOS DMG

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '3.0.0'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Icons
        run: |
          python3 scripts/build/generate_icons.py

      - name: Install Electron Dependencies
        working-directory: electron-app
        run: npm ci --no-audit

      - name: Build DMG
        working-directory: electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder build --mac --publish always

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lobster-planet-dmg
          path: dist-electron/*.dmg
          retention-days: 30

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lobster-planet-zip
          path: dist-electron/*.zip
          retention-days: 30

      - name: Generate SHA256
        run: |
          cd dist-electron
          shasum -a 256 *.dmg > SHA256SUMS.txt
          shasum -a 256 *.zip >> SHA256SUMS.txt

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "🦞 龙虾星球共创联盟 v${{ github.ref_name }}"
          body: |
            ## 🦞 龙虾星球共创联盟 v${{ github.ref_name }}

            ### OpenClaw + AnyGen + HeyGen 跨境电商品牌出海智能体集群

            ### 新增功能
            - macOS 桌面应用封装 (Electron)
            - DMG 一键安装包
            - 57+ Agent 智能体集群
            - 14 TaskFlow 业务流水线
            - 42 Webhook 外部集成
            - 龙虾星球管理驾驶舱

            ### 安装方式
            1. 下载 `龙虾星球共创联盟-*.dmg`
            2. 双击打开并拖入 Applications
            3. 首次启动可能需要允许来自未知开发者的应用

            ### 系统要求
            - macOS 12.0+ (Intel / Apple Silicon)
            - Python 3.10+
            - Node.js 20+

            ### 校验
            ```
            $(cat dist-electron/SHA256SUMS.txt)
            ```
          files: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/SHA256SUMS.txt
          draft: false
          prerelease: false
