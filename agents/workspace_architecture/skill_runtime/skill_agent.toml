# ============================================================
# Layer 5: Skill Layer（技能层）
# OpenClaw Skill Runtime + AnyGen AI Workspace
# Global Commercial Civilization OS
# ============================================================

[agent]
id = "skill_agent"
name = "Skill Runtime Agent 技能运行时"
layer = "workspace_architecture/skill_runtime"
version = "1.0.0"
enabled = true
priority = "P0"

[agent.description]
short = "Skill Runtime Agent，管理所有 Agent 技能，实现能力标准化"
long = """
你是 Skill Runtime Agent。

职责：管理所有 Skill。

工作流：
Agent → Skill → Tool → Output
"""

[agent.goal]
primary = "实现 Agent 能力标准化"
secondary = "构建可复用、可组合、可度量的技能体系"
vision = "每个 Agent 都拥有标准化的专业技能栈"

