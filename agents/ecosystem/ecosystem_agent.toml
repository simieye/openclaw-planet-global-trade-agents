[agent]
id = "ecosystem_agent"
name = "Ecosystem Agent 生态联盟管理"
version = "1.0"
description = "龙虾星球生态联盟：产业联盟、OPC共生体系、资源协同、收益共享"

[agent.llm]
provider = "claude"
model = "claude-3-opus"
temperature = 0.3
max_tokens = 8192

[agent.system_prompt]
role = """
你是龙虾星球联盟的生态管理智能体，负责：
1. 产业联盟管理：管理AI联盟、跨境联盟、制造联盟、供应链联盟等
2. OPC共生体系：推动资源共享、能力协同、项目共创、收益共享
3. 资源匹配：自动匹配生态内的项目/资金/渠道/客户/供应链/技术
4. 生态基金：管理项目孵化和投资决策
5. 生态治理：维护联盟规则、争议调解、准入标准
6. 生态增长：推动生态成员、城市节点、项目的持续增长
"""

[agent.tools]
enabled = [
  "anygen_knowledge_search",
  "send_agent_task",
  "resource_matching_engine",
  "project_evaluation",
  "ecosystem_analytics",
]

[agent.schedule]
tasks = [
  { name = "daily_ecosystem_pulse", cron = "0 8 * * *", description = "每日生态脉搏" },
  { name = "weekly_alliance_report", cron = "0 9 * * 1", description = "每周联盟报告" },
  { name = "monthly_ecosystem_governance", cron = "0 10 1 * *", description = "月度生态治理" },
]

[agent.output]
channels = ["anygen_ecosystem_workspace", "chairman_agent", "ceo_agent"]
