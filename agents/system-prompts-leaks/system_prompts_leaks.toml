# System Prompts Leaks Agent — AI工具提示词泄露合集
# 基于 https://github.com/x1xhlol/system-prompts-and-models-of-ai-tools (140K Stars)

[agent]
name = "System Prompts Leaks"
version = "1.0.0"
description = "收录40+款AI工具的内部系统提示词，用于提示词工程研究、安全审计和Agent开发参考"
author = "x1xhlol (Lucas Valbuena) / 龙虾星球集成"
license = "GPL-3.0"
source_repo = "https://github.com/x1xhlol/system-prompts-and-models-of-ai-tools"
source_repo_chinese = "https://github.com/CreatorEdition/system-prompts-and-models-of-ai-tools-chinese"

[capabilities]
query_prompt = true        # 按工具名查询系统提示词
compare_prompts = true     # 对比不同工具的提示词
analyze_security = true    # 安全约束分析
extract_patterns = true    # 提取提示词设计模式
version_tracking = true    # 版本演进追踪

[toolkits]
count = 42
total_files = 102
categories = [
    "AI编程IDE",
    "AI编程助手",
    "AI Agent",
    "大模型厂商",
    "国内工具",
    "企业效率",
    "开源社区"
]

[prompts]
system = """
你是一个AI工具系统提示词知识库助手，可以访问40+款AI工具的内部提示词和配置。

你的能力包括：
1. 查询特定工具的完整系统提示词
2. 对比不同工具的提示词设计策略
3. 分析提示词中的安全约束和防御机制
4. 提取可复用的提示词工程模式
5. 追踪工具的提示词版本演变

使用 skills/system-prompts-leaks/data/ 目录下的文件作为数据源。
catalog.json 包含完整的文件索引。

当用户询问时：
- 先读取 catalog.json 确认目标工具是否存在
- 再读取对应的提示词文件
- 提供结构化的分析和对比

⚠️ 重要：所有内容仅供学习研究使用，不鼓励商业滥用。
"""

[triggers]
keywords = [
    "系统提示词", "system prompt", "提示词泄露", "prompt leak",
    "内部提示词", "internal prompt", "提示词工程",
    "Cursor提示词", "Claude提示词", "Devin提示词",
    "CodeBuddy提示词", "Windsurf提示词", "Manus提示词",
    "AI工具对比", "提示词对比", "prompt comparison",
    "agent prompt", "craft prompt", "chat prompt"
]

[data]
catalog_path = "skills/system-prompts-leaks/data/catalog.json"
data_root = "skills/system-prompts-leaks/data/"
file_count = 102
tool_count = 42

[featured_tools]
cursor = "Cursor Prompts"       # 7 files: Agent Prompt多个版本 + Chat + Tools
claude = "Anthropic"             # 3 files: Claude Code 2.0 + Sonnet 4.5/4.6
codebuddy = "CodeBuddy Prompts"  # 2 files: Chat + Craft
manus = "Manus Agent Tools & Prompt" # 4 files: Prompt + Agent Loop + Modules + Tools
windsurf = "Windsurf"            # 2 files: Wave 11 Prompt + Tools
devin = "Devin AI"               # 2 files: Prompt + DeepWiki
v0 = "v0 Prompts and Tools"      # 2 files: Prompts + Tools
vscode = "VSCode Agent"          # 9 files: 最多文件数
