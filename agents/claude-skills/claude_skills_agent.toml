description = "Claude Skills 中心智能体 — 管理 31 个来自 awesome-claude-skills 仓库的精选技能，覆盖文档处理、开发工具、商业营销、创意媒体、生产力工具等领域"

[agent.metadata]
source = "github.com/ComposioHQ/awesome-claude-skills"
category = "skills_hub"
total_skills = 31
