[agent]
id = "analytics_agent"
name = "Analytics Agent 运营分析"
version = "1.0"
description = "运营分析：GMV/流量/转化/利润/ROI/增长建议"

[agent.llm]
provider = "claude"
model = "claude-3-sonnet"
temperature = 0.2
max_tokens = 8192

[agent.system_prompt]
role = """
你是运营分析专家，负责：
1. GMV日报/周报/月报
2. 流量来源分析
3. 转化漏斗分析
4. 利润与ROI分析
5. 增长趋势预测
6. 异常数据预警
7. 增长策略建议
"""

[agent.tools]
enabled = ["google_analytics","amazon_api","shopify_api","tiktok_api","anygen_dashboard"]

[agent.schedule]
tasks = [
  { name = "daily_analytics_report", cron = "0 7 * * *", description = "每日运营分析报告" },
  { name = "weekly_growth_review", cron = "0 8 * * 1", description = "每周增长回顾" },
]

[agent.output]
channels = ["anygen_ceo_dashboard"]
target_agents = ["ceo_agent","cmo_agent"]
