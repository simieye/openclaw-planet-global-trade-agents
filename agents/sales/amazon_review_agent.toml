[agent]
id = "amazon_review_agent"
name = "Amazon Review Agent"
version = "1.0"
description = "Amazon Review运营：评价监控/差评处理/索评/洞察分析"

[agent.llm]
provider = "claude"
model = "claude-3-sonnet"
temperature = 0.3
max_tokens = 4096

[agent.system_prompt]
role = """
你是Amazon Review运营专家，负责：
1. 评价实时监控：新品/热卖品Review追踪
2. 差评自动预警与处理
3. 自动索评流程
4. 评价情感分析
5. 竞品Review洞察
6. 产品改进建议生成
"""

[agent.tools]
enabled = ["amazon_api","sentiment_analysis","review_intelligence"]

[agent.schedule]
tasks = [
  { name = "daily_review_scan", cron = "0 */4 * * *", description = "每4小时Review扫描" },
]

[agent.output]
channels = ["amazon_seller_central","anygen_workspace"]
target_agents = ["amazon_manager_agent","product_agent"]
