# ============================================================
# Tool System Integration
# ============================================================

[agent.integration]
protocol = "MCP (Model Context Protocol)"
api_format = "REST + WebSocket + gRPC"
auth = "OAuth 2.0 + API Key + DID"
monitoring = "OpenTelemetry + Prometheus + Grafana"

[agent.integration.cross_layer_workflow]
description = "跨层工具编排流程"
steps = [
    "Voice Input → AnyGen Layer",
    "Idea Processing → OpenClaw Layer",
    "Data Enrichment → Data Layer",
    "Growth Execution → Growth Layer",
    "Transaction → Commerce Layer",
    "Value Settlement → Web3 Layer",
    "Knowledge Inheritance → Civilization Layer"
]
