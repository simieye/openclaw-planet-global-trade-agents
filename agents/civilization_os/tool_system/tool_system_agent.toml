# ============================================================
# Global Commercial Civilization OS - Tool System
# OpenClaw × AnyGen × Data × Growth × Commerce × Web3 × Civilization
# 全球商业文明操作系统 工具系统
# ============================================================

[agent]
id = "tool_system_agent"
name = "Global Commercial Civilization Tool System 文明工具系统"
layer = "civilization_os/tool_system"
version = "1.0.0"
enabled = true
priority = "P0"

[agent.description]
short = "全球商业文明操作系统工具矩阵"
long = """
覆盖 7 大工具层的完整技术栈：
OpenClaw Layer → AnyGen Layer → Data Layer → Growth Layer → Commerce Layer → Web3 Layer → Civilization Layer
"""

# ============================================================
# Layer 1: OpenClaw Layer
# ============================================================

[agent.layers.openclaw]
name = "OpenClaw Layer"
description = "多智能体操作系统核心"

[agent.layers.openclaw.components]
agent_runtime = "Agent 运行时引擎"
skill_engine = "技能执行引擎"
workflow_engine = "工作流编排引擎"
memory_engine = "记忆管理引擎"
rag_engine = "检索增强生成引擎"
mcp_connector = "MCP 协议连接器"
agent_marketplace = "Agent 市场"

# ============================================================
# Layer 2: AnyGen Layer
# ============================================================

[agent.layers.anygen]
name = "AnyGen Layer"
description = "AI 工作空间平台"

[agent.layers.anygen.components]
voice_to_document = "语音转文档"
ai_workspace = "AI 工作空间"
ai_presentation = "AI PPT 生成"
ai_meeting = "AI 会议管理"
multi_agent_collaboration = "多 Agent 协同"
