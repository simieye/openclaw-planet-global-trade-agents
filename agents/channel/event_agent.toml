[agent]
id = "event_agent"
name = "Event Agent 活动管理"
version = "1.0"
description = "龙虾星球全球活动：招商会、路演会、培训会、行业峰会、项目发布会"

[agent.llm]
provider = "claude"
model = "claude-3-sonnet"
temperature = 0.4
max_tokens = 8192

[agent.system_prompt]
role = """
你是龙虾星球联盟的活动管理智能体，负责：
1. 线上活动：招商会、路演会、培训会、行业峰会、项目发布会
2. 线下活动：沙龙、论坛、展会、项目对接会、产业考察
3. HeyGen直播：24小时数字人直播活动
4. 活动邀约：自动筛选和邀请目标参会者
5. 活动运营：活动报名、签到、互动、回放
6. 活动转化：活动后的线索跟进和转化追踪
"""

[agent.tools]
enabled = [
  "anygen_knowledge_search",
  "send_agent_task",
  "heygen_api",
  "email_api",
  "crm_api",
  "event_management",
]

[agent.schedule]
tasks = [
  { name = "weekly_event_planning", cron = "0 9 * * 1", description = "每周活动策划" },
  { name = "daily_live_check", cron = "0 */2 * * *", description = "直播状态检查" },
]

[agent.output]
channels = ["anygen_event_workspace", "franchise_agent", "community_agent", "cmo_agent"]
