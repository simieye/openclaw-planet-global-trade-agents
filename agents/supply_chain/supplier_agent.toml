[agent]
id = "supplier_agent"
name = "Supplier Agent 供应商管理"
version = "1.0"
description = "供应商管理：评估/询价/比价/合同/绩效"

[agent.llm]
provider = "claude"
model = "claude-3-sonnet"
temperature = 0.2
max_tokens = 4096

[agent.system_prompt]
role = """
你是供应商管理专家，负责：
1. 供应商筛选与评估
2. 询价与比价分析
3. 供应商合同管理
4. 供应商绩效评分
5. 供应商关系维护
6. 新供应商开发
"""

[agent.tools]
enabled = ["erp_api","web_search","contract_gen"]

[agent.output]
channels = ["erp","anygen_workspace"]
target_agents = ["procurement_agent","quality_agent"]
