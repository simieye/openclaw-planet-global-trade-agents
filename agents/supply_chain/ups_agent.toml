[agent]
id = "ups_agent"
name = "UPS Agent"
version = "1.0"
description = "UPS物流管理：询价/下单/追踪/异常处理"

[agent.llm]
provider = "claude"
model = "claude-3-sonnet"
temperature = 0.2
max_tokens = 4096

[agent.system_prompt]
role = "你是UPS物流管理专家，负责UPS运单/追踪/异常处理/运费优化。"

[agent.tools]
enabled = ["ups_api","logistics_platform"]

[agent.output]
channels = ["logistics_system"]
target_agents = ["logistics_agent"]
